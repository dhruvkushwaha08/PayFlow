name: PayFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: payflow_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/payflow_db
          DB_USERNAME: root
          DB_PASSWORD: ci_password
        run: ./mvnw test

      - name: Build backend
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/payflow_db
          DB_USERNAME: root
          DB_PASSWORD: ci_password
        run: ./mvnw clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t payflow-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t payflow-frontend:ci ./frontend