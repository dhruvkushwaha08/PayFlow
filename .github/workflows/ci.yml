name: PayFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: payflow_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: ci_rag_password
          POSTGRES_DB: payflow_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U payflow -d payflow_rag"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Download ONNX embedding model
        working-directory: backend
        run: |
          mkdir -p models/onnx/all-MiniLM-L6-v2
          curl -L \
            https://huggingface.co/onnx-models/all-MiniLM-L6-v2-onnx/resolve/main/model.onnx \
            -o models/onnx/all-MiniLM-L6-v2/model.onnx
          curl -L \
            https://huggingface.co/onnx-models/all-MiniLM-L6-v2-onnx/resolve/main/tokenizer.json \
            -o models/onnx/all-MiniLM-L6-v2/tokenizer.json

      - name: Initialize RAG database
        env:
          PGPASSWORD: ci_rag_password
        run: |
          psql -h 127.0.0.1 -U payflow -d payflow_rag -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h 127.0.0.1 -U payflow -d payflow_rag -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql -h 127.0.0.1 -U payflow -d payflow_rag -c "CREATE TABLE IF NOT EXISTS vector_store (id UUID PRIMARY KEY DEFAULT uuid_generate_v4(), content TEXT NOT NULL, metadata JSONB, embedding vector(384));"
          psql -h 127.0.0.1 -U payflow -d payflow_rag -c "CREATE INDEX IF NOT EXISTS vector_store_embedding_idx ON vector_store USING hnsw (embedding vector_cosine_ops);"

      - name: Run backend tests
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/payflow_db
          DB_USERNAME: root
          DB_PASSWORD: ci_password
          RAG_DB_URL: jdbc:postgresql://127.0.0.1:5432/payflow_rag
          RAG_DB_USERNAME: payflow
          RAG_DB_PASSWORD: ci_rag_password
          SPRING_AI_EMBEDDING_TRANSFORMER_ONNX_MODEL_OUTPUT_NAME: token_embeddings
        run: ./mvnw test

      - name: Build backend
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/payflow_db
          DB_USERNAME: root
          DB_PASSWORD: ci_password
          RAG_DB_URL: jdbc:postgresql://127.0.0.1:5432/payflow_rag
          RAG_DB_USERNAME: payflow
          RAG_DB_PASSWORD: ci_rag_password
        run: ./mvnw clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t payflow-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t payflow-frontend:ci ./frontend