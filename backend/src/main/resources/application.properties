# ==============================
# Application
# ==============================

spring.application.name=backend


# ==============================
# Primary Database - MySQL
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/payflow_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none


# ==============================
# RAG Database - PostgreSQL
# ==============================

rag.datasource.url=jdbc:postgresql://localhost:5432/payflow_rag
rag.datasource.username=payflow
rag.datasource.password=${RAG_DB_PASSWORD}


# ==============================
# Local ONNX Embedding Model
# ==============================

spring.ai.embedding.transformer.onnx.model-uri=file:models/onnx/all-MiniLM-L6-v2/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=file:models/onnx/all-MiniLM-L6-v2/tokenizer.json


# ==============================
# Groq AI Configuration
# ==============================

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b

spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none