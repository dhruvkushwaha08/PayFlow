services:

  backend:
    image: payflow-backend:latest
    container_name: payflow-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://host.docker.internal:3306/payflow_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: payflow-frontend:latest
    container_name: payflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend